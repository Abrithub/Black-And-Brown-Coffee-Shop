<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2A1A10" />
    <meta name="description" content="Black & Brown Coffee Shop — Handcrafted Ethiopian Coffee Experience. Order online, track your orders." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B&B Coffee" />

    <!-- Open Graph -->
    <meta property="og:title" content="Black & Brown Coffee Shop" />
    <meta property="og:description" content="Handcrafted Ethiopian Coffee Experience" />
    <meta property="og:type" content="website" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/img/icon-192.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Black & Brown Coffee Shop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
